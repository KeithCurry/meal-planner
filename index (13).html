<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Household Meal Planner</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <header>
    <h1>Meal Planner</h1>
    <nav hidden id="nav">
      <button data-tab="recipes" class="active">Recipes</button>
      <button data-tab="planner">Weekly Plan</button>
      <button data-tab="grocery">Grocery List</button>
      <button id="logout">Sign out</button>
    </nav>
  </header>

  <main>
    <section id="login-view">
      <h2>Sign in</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="you@example.com" required>
        <button type="submit">Email me a sign-in link</button>
      </form>
      <p id="login-msg" class="muted"></p>
    </section>

    <section id="app-view" hidden>

      <div id="tab-recipes" class="tab">
        <form id="recipe-form" class="card">
          <h2>Add a recipe</h2>
          <input id="r-title" placeholder="Title" required>
          <textarea id="r-desc" rows="2" placeholder="Short description (optional)"></textarea>
          <div class="row">
            <label>Minutes <input type="number" id="r-minutes" min="0"></label>
            <label>Servings <input type="number" id="r-servings" min="1" value="4"></label>
          </div>
          <input id="r-tags" placeholder="Tags, comma separated (e.g. vegetarian, quick, kid-friendly)">
          <label>Ingredients (one per line, e.g. "2 cups rice")
            <textarea id="r-ingredients" rows="6"></textarea>
          </label>
          <label>Steps
            <textarea id="r-steps" rows="5"></textarea>
          </label>
          <button type="submit">Save recipe</button>
        </form>

        <div class="filters">
          <input id="search" placeholder="Search by title or ingredient">
          <select id="tag-filter"><option value="">All tags</option></select>
        </div>
        <div id="recipe-list" class="grid"></div>
      </div>

      <div id="tab-planner" class="tab" hidden>
        <div class="week-nav">
          <button id="prev-week">&larr;</button>
          <strong id="week-label"></strong>
          <button id="next-week">&rarr;</button>
        </div>
        <div class="table-wrap">
          <table id="plan-table"></table>
        </div>
        <p class="muted">Changes save automatically. Servings controls how the grocery list scales.</p>
      </div>

      <div id="tab-grocery" class="tab" hidden>
        <div class="week-nav">
          <button id="g-prev">&larr;</button>
          <strong id="g-label"></strong>
          <button id="g-next">&rarr;</button>
        </div>
        <div id="grocery-list"></div>
      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
